# Local development only. In AWS the api and worker run on ECS Fargate and
# the database is managed Postgres; nothing here is used in deployment.
#
#   docker compose up -d db              # just Postgres (the usual setup)
#   docker compose up -d mailpit elasticmq
#                                        # local email (SMTP :1025, UI http://localhost:8025)
#                                        # and SQS (ElasticMQ :9324; docker/elasticmq.conf)
#   docker compose --profile app up      # all of the above + api + worker in containers

# Inside the compose network: Mailpit, ElasticMQ and local blob storage.
# Dummy AWS credentials are for ElasticMQ only (boto3 refuses to sign without any).
x-local-services: &local-services
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SQS_ENDPOINT_URL: http://elasticmq:9324
  SQS_QUEUE_URL: http://elasticmq:9324/000000000000/bido-jobs
  SQS_INTAKE_QUEUE_URL: http://elasticmq:9324/000000000000/bido-intake
  SQS_PARKING_QUEUE_URL: http://elasticmq:9324/000000000000/bido-parking
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  # Shared by api and worker (the `blobs` volume): raw emails and attachments.
  STORAGE_LOCAL_DIR: /data/blobs

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres # local-only superuser password
      POSTGRES_DB: bido
    ports:
      - "54320:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bido"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every outbound email (SMTP on 1025); read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # SQS-compatible queues: bido-jobs, bido-intake, bido-parking.
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro

  # One-shot: the image runs as uid 10001, and a fresh named volume is root-owned.
  blobs-init:
    profiles: ["app"]
    build: .
    image: bido-back:local
    user: "0:0"
    command: ["chown", "10001:10001", "/data/blobs"]
    volumes:
      - blobs:/data/blobs

  api:
    profiles: ["app"]
    build: .
    image: bido-back:local
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is `db:5432`, not localhost:54320.
      DATABASE_URL: postgresql+asyncpg://bido_app:app@db:5432/bido
      MIGRATION_DATABASE_URL: postgresql+asyncpg://bido_migrator:migrator@db:5432/bido
      AGNO_DATABASE_URL: postgresql+asyncpg://bido_agno:agno@db:5432/bido
      AGNO_TELEMETRY: "false"
      <<: *local-services
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      elasticmq:
        condition: service_started
      blobs-init:
        condition: service_completed_successfully
    volumes:
      - blobs:/data/blobs

  worker:
    profiles: ["app"]
    build: .
    image: bido-back:local
    command: ["python", "-m", "bido_back.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://bido_app:app@db:5432/bido
      MIGRATION_DATABASE_URL: postgresql+asyncpg://bido_migrator:migrator@db:5432/bido
      AGNO_DATABASE_URL: postgresql+asyncpg://bido_agno:agno@db:5432/bido
      AGNO_TELEMETRY: "false"
      <<: *local-services
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      elasticmq:
        condition: service_started
      blobs-init:
        condition: service_completed_successfully
    volumes:
      - blobs:/data/blobs

volumes:
  db-data:
  blobs:
