name: Deploy (dev)

# Builds the arm64 image once, pushes it to ECR tagged with the git SHA,
# registers new api / worker / migrate task definitions with that image, runs
# the migrations as a one-off task (the deploy stops if they fail), then rolls
# the api and worker services and waits until they are stable. The steps live
# in deploy.yml, shared with Deploy (prd); this file decides when dev deploys.
#
# Runs after CI succeeds on a push to main, or by hand. Rollback: run it by
# hand with `image_tag` set to an earlier SHA; nothing is rebuilt.
#
# Inert until the `dev` environment has its variables (README, "Deploy"):
# without them the job logs a notice and does nothing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy an image already in ECR (a git SHA). Empty: build the selected ref."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    # The called job assumes the dev deploy role through OIDC.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image_tag: ${{ inputs.image_tag || '' }}
