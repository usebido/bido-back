[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

# Agave (Solana CLI) version the program is built and verified with; CI and `solana-verify build`
# read it (spec 01 sections 3.1 and 3.13).
[workspace.metadata.cli]
solana = "4.1.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
