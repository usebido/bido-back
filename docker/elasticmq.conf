# ElasticMQ (local SQS) for `docker compose up elasticmq`. LOCAL ONLY.
# Queue URLs from the host: http://localhost:9324/000000000000/<queue-name>
# (set SQS_ENDPOINT_URL=http://localhost:9324; boto3 needs any dummy
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY values).
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  # Worker jobs (envelopes with a tenant_id).
  bido-jobs {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
  }
  # Raw inbound emails: no tenant until matched.
  bido-intake {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
  }
  # Messages the worker or the intake consumer can never handle.
  bido-parking {}
}
